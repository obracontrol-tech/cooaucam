name: Fabricar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        id: apk
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "CooauCAM-v$VERSION.apk"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-b${{ github.run_number }}
          name: CooauCAM v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: "Toca CooauCAM-v${{ steps.apk.outputs.version }}.apk para descargar e instalar."
          files: CooauCAM-v${{ steps.apk.outputs.version }}.apk
          make_latest: true
